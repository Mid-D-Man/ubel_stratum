# Cargo.toml
[package]
name = "ubel_stratum"
version = "0.1.0"
edition = "2021"
authors = ["Mid-D-Man"]
license = "MIT OR Apache-2.0"
description = "Ubel Stratum - Quantum-Ready Multi-Tier Systems Language"
repository = "https://github.com/Mid-D-Man/ubel_stratum"

[features]
# parser is on by default so `cargo build`, `cargo run`, and full `cargo test`
# all work as before. Use --no-default-features to skip grammar.rs compilation.
default = ["parser"]
parser  = ["lalrpop-util"]

[dependencies]
# lalrpop-util is optional — only pulled in when the parser feature is active.
lalrpop-util = { version = "0.20", features = ["lexer"], optional = true }
clap         = { version = "4.5",  features = ["derive"] }
thiserror    = "1.0"
miette       = { version = "7.0",  features = ["fancy"] }
phf          = { version = "0.11", features = ["macros"] }
lazy_static  = "1.4"
bumpalo      = { version = "3",    features = ["collections"] }
logos        = "0.14"

[build-dependencies]
# lalrpop itself (the code-generator) cannot be made optional in build-deps —
# Cargo doesn't support that. But lalrpop the tool runs in milliseconds;
# the slowness is rustc compiling the generated grammar.rs. By gating
# `pub mod parser` behind the feature flag, rustc never sees grammar.rs
# when the feature is off, even though lalrpop still generates the file.
lalrpop = "0.20"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1.4"

[[bin]]
name = "stratc"
path = "src/main.rs"

[lib]
name = "ubel_stratum"
path = "src/lib.rs"

[[bench]]
name    = "lexer_bench"
harness = false

[[bench]]
name    = "ast_bench"
harness = false

[[bench]]
name    = "parser_bench"
harness = false

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[profile.bench]
inherits      = "release"
lto           = false
codegen-units = 4
