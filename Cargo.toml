[workspace]
members  = ["crates/core", "crates/parser", "crates/rd_parser"]
resolver = "2"

# Profiles are workspace-level; all crates inherit without re-declaring.
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[profile.bench]
inherits      = "release"
lto           = false
codegen-units = 4
