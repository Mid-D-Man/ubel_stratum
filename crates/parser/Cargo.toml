# ubel_stratum_parser/Cargo.toml
[package]
name        = "ubel_stratum_parser"
version     = "0.1.0"
edition     = "2021"
authors     = ["Mid-D-Man"]
license     = "MIT OR Apache-2.0"
description = "LALRPOP parser frontend for Ubel Stratum"
repository  = "https://github.com/Mid-D-Man/ubel_stratum"

[dependencies]
ubel_stratum = { path = "../core" }
lalrpop-util = { version = "0.20", features = ["lexer"] }
clap         = { version = "4.5",  features = ["derive"] }

[build-dependencies]
lalrpop = "0.20"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "stratc"
path = "src/main.rs"

[[bench]]
name    = "parser_bench"
harness = false
