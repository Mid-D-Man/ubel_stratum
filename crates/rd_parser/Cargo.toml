[package]
name        = "ubel_stratum_rd"
version     = "0.1.0"
edition     = "2021"
authors     = ["Mid-D-Man"]
license     = "MIT OR Apache-2.0"
description = "Recursive-descent parser for Ubel Stratum — no code-generation step required"
repository  = "https://github.com/Mid-D-Man/ubel_stratum"

[dependencies]
ubel_stratum = { path = "../core" }
# Non-crypto hash — 2-3x faster than SipHash for memo cache + internal maps
rustc-hash   = "1.1"
# memchr for fast byte scanning in any string re-parsing sub-parsers
memchr       = "2"
# once_cell for Lazy statics (already transitively present; make it explicit)
once_cell    = "1"
# phf for static string → kind dispatch tables (attribute names, cfg keys)
phf          = { version = "0.11", features = ["macros"] }

[dev-dependencies]
ubel_stratum = { path = "../core" }
