name: Run mdix replacements

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Path to .mdix replacements manifest'
        required: false
        default: '.mdix/replacements/replacements.mdix'
      dry_run:
        description: 'true = preview only. false = actually write + commit.'
        required: false
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      file_strategy:
        description: 'How to handle existing files at the resolved target path'
        required: false
        type: choice
        default: 'overwrite'
        options:
          - 'overwrite'
          - 'skip'
          - 'backup'
          - 'rename'
      delete_processed_archives:
        description: 'After a successful non-dry-run apply, delete the processed archive(s) from .mdix/replacements/ so they cannot be accidentally re-run later'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
  push:
    paths:
      - '.mdix/replacements/**'

jobs:
  run-replacements:
    uses: Mid-D-Man/mdix-scaffold/.github/workflows/generate-structure.yml@main
    permissions:
      contents: write
    with:
      template:       ${{ inputs.template || '.mdix/replacements/replacements.mdix' }}
      # Forced 'true' on every push; only a manual dispatch can flip this,
      # same non-committal-on-automatic-trigger rule as run-patch.yml.
      dry_run:        ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'true' }}
      file_strategy:  ${{ inputs.file_strategy || 'overwrite' }}
      delete_processed_archives: ${{ inputs.delete_processed_archives || 'false' }}
